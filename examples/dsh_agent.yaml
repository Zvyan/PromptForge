# ========================================================
# DeepSeek Harness (dsh) Agent Configuration
# Generated by PromptForge for 代码审查
# ========================================================

'# framework': DeepSeek Harness (dsh) - Cordis Microkernel Agent Runtime
version: '1.0'
agent:
  name: code_review
  display_name: 代码审查
  category: coding
  preset: code
  default_model: deepseek-chat
  reasoning_model: deepseek-reasoner
persona:
  system_prompt: '你是一个资深的 Python 专家级工程师和架构师，精通代码审查。


    你的任务是对提供的代码进行深入审查。


    请采用最严格的标准，不放过任何微小的瑕疵，包括命名规范、注释和潜在的性能瓶颈。



    请特别关注以下领域：


    - readability


    - performance


    - security


    ## 输出格式

    1. 总体评价 (简短)

    2. 关键发现 (按严重程度排序)

    3. 代码级具体建议 (包含修改前后的代码对比)

    4. 最佳实践推荐


    ## 约束条件

    - 所有的建议必须具体且可执行。

    - 提供改进代码示例。'
  rules:
  - 遵循局部优先与直接执行原则 (Local-first & Direct execution)
  - 代码修改提供精准的 Unified Diff 或可替换代码块
  - 针对 DeepSeek-R1 模型优先采用确定性约束，避免冗余的 '逐步思考' 提示干扰模型原生思维链
runtime:
  plugins:
  - name: '@dsh/plugin-model-deepseek'
    config:
      model: deepseek-chat
      temperature: 0.0
  - name: '@dsh/plugin-tool-filesystem'
    config:
      sandbox: true
      allow_write: true
  - name: '@dsh/plugin-tool-terminal'
    config:
      timeout_ms: 30000
  - name: '@dsh/plugin-session-local'
task:
  instruction: '请审查以下 Python 代码：


    ```Python

    def add(a, b): return a + b

    ```'
