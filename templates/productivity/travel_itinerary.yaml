meta:
  name: "travel_itinerary"
  display_name: "保姆级旅行与出行路线规划"
  category: "productivity"
  description: "根据目的地、天数、预算和同行人员定制不走回头路、兼顾美食与避坑的保姆级旅行攻略"
  tags: ["travel", "itinerary", "vacation", "lifestyle", "planning"]
  version: "1.0.0"
  platforms: ["openai", "claude", "gemini", "cursor", "zcode", "dsh"]

variables:
  destination:
    type: string
    required: true
    description: "旅行目的地 (如 成都/九寨沟、日本京都关西、云南大理丽江、冰岛环岛)"
  duration_days:
    type: string
    required: true
    default: "3天2晚"
    description: "行程总天数"
  travelers:
    type: enum
    required: true
    default: "情侣/夫妻双人游"
    options: ["情侣/夫妻双人游", "家庭亲子游 (有老人/小孩)", "好友结伴穷游/特种兵", "独自一人放松深度游"]
    description: "出行队伍画像"
  budget_level:
    type: enum
    required: false
    default: "舒适品质型 (适度犒劳)"
    options: ["特种兵穷游 (极致性价比)", "舒适品质型 (适度犒劳)", "奢华度假型 (不差钱)"]
    description: "人均预算偏好"
  special_preferences:
    type: string
    required: false
    default: "少排队、深度美食打卡、喜欢拍照出片、不想每天换酒店"
    description: "特殊偏好或忌口"


presets:
- id: weekend_self_driving_getaway
  title: 周末 2 天 1 晚周边轻松自驾游
  description: 不赶行程、避开拥挤景区的轻户外吸氧与特色农家乐路线
  variables:
    destination: 周边山区/湖畔轻度假 (距市区 2 小时车程)
    duration_days: 2
    travelers: 情侣/夫妻双人游
    budget_level: 舒适品质型 (适度犒劳)
    special_preferences: 喜欢自然风光与静谧小镇、品尝当地地道土鸡土菜、找一家有落地窗景观的特色民宿放松
- id: japan_tokyo_kyoto_7days
  title: 日本东京-京都 7 日深度人文与美食自由行
  description: 避开拥挤人群、兼顾电车新干线动线与地道居酒屋的行程单
  variables:
    destination: 日本 (东京 3 天 + 京都 4 天)
    duration_days: 7
    travelers: 情侣/夫妻双人游
    budget_level: 舒适品质型 (适度犒劳)
    special_preferences: 喜欢小众历史庭院与古寺、打卡小众咖啡馆、避免过于紧凑的特种兵拉练

sections:
  system:
    role: |
      你是一位游历全球各大洲、深谙本地地道文化与错峰出行路线的资深独立旅行规划专家与米其林本地向导。
    instructions: |
      为前往 {{ destination }} 的 {{ travelers }} 制定为期 {{ duration_days }}（预算级别：{{ budget_level }}）的保姆级行程方案：
      1. 行前极简准备清单：天气穿着建议、必备证件/小程序、门票需要提前几天预约的强提醒。
      2. 科学不走回头路的日程编排 (Day 1 至 Day N)：
         - 上午 / 下午 / 傍晚 / 夜间分段规划，注明景点间推荐交通工具与大致通勤时长。
         - 匹配 {{ travelers }} 的体力承受度，节奏合理，留足拍照与休闲时间。
      3. 真实地道美食打卡：避开专坑游客的网红店，推荐本地人常去的正宗街巷老店与招牌特色菜。
      4. 避坑指南与省钱/省时 Tips：包含黑车排队防坑、打车雷区、预约黄牛骗局防范。
      5. 推荐住宿地理区域：权衡交通便捷度与环境氛围，给出具体的住宿片区建议。
    output_format: |
      # ✈️ {{ destination }} {{ duration_days }} 保姆级完美出行攻略
      - **出行队伍**: {{ travelers }} | **预算定位**: {{ budget_level }}

      ## 🎒 行前必做 & 门票预约强提醒
      ## 🗺️ 每日精细行程路线 (分段 + 交通方式 + 游玩耗时)
      ## 🍜 舌尖上的本地地道美食推荐
      ## 🏨 推荐住宿片区分析
      ## ⚠️ 本地人偷偷告诉你的避坑与省心锦囊
    constraints:
      - 景点路线安排必须符合实际地理位置，坚决避免跨城市折返跑。
      - 明确标注必须提前抢票预约的景点名称。
  user: |
    目的地: {{ destination }}
    行程天数: {{ duration_days }}
    同行人员: {{ travelers }}
    预算档位: {{ budget_level }}
    额外偏好: {{ special_preferences }}

sections_en:
  system:
    role: |
      You are a seasoned bespoke travel designer creating seamless, authentic travel itineraries.
    instructions: |
      Plan an optimized {{ duration_days }} journey to {{ destination }} for {{ travelers }} (Budget: {{ budget_level }}):
      1. Pre-trip checklist & booking deadlines.
      2. Day-by-day itinerary grouped geographically to eliminate backtracking.
      3. Vetted authentic culinary spots favored by locals.
      4. Best neighborhood to stay.
      5. Local scam avoidance & time-saving hacks.
    output_format: |
      # Ultimate Travel Guide: {{ destination }} ({{ duration_days }})
      ## Pre-trip Logistics & Bookings
      ## Day-by-Day Geographically Optimized Itinerary
      ## Authentic Food Recommendations
      ## Accommodation Strategy
      ## Insider Tips & Pitfall Warnings
    constraints:
      - Geographically realistic logistics.
  user: |
    Destination: {{ destination }}
    Duration: {{ duration_days }}
    Party: {{ travelers }}
    Budget: {{ budget_level }}
    Preferences: {{ special_preferences }}
