meta:
  name: "refactor"
  display_name: "代码重构"
  category: "coding"
  description: "结构化代码重构"
  tags: ["refactoring", "clean-code"]
  version: "1.0.0"
  platforms: ["openai", "claude", "gemini", "cursor"]

variables:
  language:
    type: string
    required: true
    description: "编程语言"
  refactor_goal:
    type: enum
    required: true
    options: ["readability", "performance", "maintainability", "testability"]
    description: "重构主要目标"
  code_content:
    type: string
    required: true
    description: "需要重构的代码"


presets:
- id: spaghetti_script_to_functions
  title: 散装 Python 脚本拆分为清晰的独立小函数
  description: 将全局变量与散乱平铺代码封装为高复用性、带参数与返回值的函数
  variables:
    language: Python
    refactor_goal: readability
    code_content: "# 统计文章词频的散乱代码\ntext = open('article.txt').read()\ntext = text.lower().replace(',',\
      \ '').replace('.', '')\nwords = text.split()\nd = {}\nfor w in words:\n    if\
      \ w in d:\n        d[w] += 1\n    else:\n        d[w] = 1\nitems = sorted(d.items(),\
      \ key=lambda x: x[1], reverse=True)\nfor k, v in items[:10]:\n    print(k, v)"
- id: fat_controller_to_ddd
  title: 巨石 Controller 拆分为 DDD 分层架构
  description: 抽离业务逻辑，分离 Application Service 与 Domain Entity
  variables:
    language: Java
    refactor_goal: maintainability
    code_content: "@PostMapping(\"/orders\")\npublic ResponseEntity createOrder(@RequestBody\
      \ OrderDTO dto) {\n    // 校验库存、计算满减、扣减库存、调用微信支付、保存订单明细、发送MQ消息全部混在一个方法中，共计 450\
      \ 行代码\n    if (dto.getItems() == null || dto.getItems().isEmpty()) return ResponseEntity.badRequest().build();\n\
      \    // ... 紧耦合业务逻辑 ...\n}"
- id: callback_to_async_await
  title: 多层嵌套回调重构为现代 Async/Await
  description: 消除回调地狱，改写为 Promise 链式调用与统一异常处理
  variables:
    language: TypeScript
    refactor_goal: readability
    code_content: "function processData(userId, callback) {\n    db.getUser(userId,\
      \ function(err, user) {\n        if (err) return callback(err);\n        api.fetchUserProfile(user.token,\
      \ function(err, profile) {\n            if (err) return callback(err);\n   \
      \         cache.set(userId, profile, function(err, res) {\n                callback(null,\
      \ res);\n            });\n        });\n    });\n}"

sections:
  system:
    role: |
      你是一位专注于软件架构和 Clean Code 的 {{ language }} 资深工程师。
    instructions: |
      你的任务是对提供的代码进行重构，核心目标是提升 {{ refactor_goal }}。
      
      {% if refactor_goal == 'readability' %}
      请重点关注变量命名、函数拆分、降低嵌套层级和清晰的注释。
      {% elif refactor_goal == 'performance' %}
      请重点关注时间/空间复杂度优化、缓存利用、减少不必要的对象创建。
      {% elif refactor_goal == 'maintainability' %}
      请重点关注单一职责原则、解耦、设计模式的应用。
      {% elif refactor_goal == 'testability' %}
      请重点关注依赖注入、纯函数化、隔离外部依赖以便于编写单元测试。
      {% endif %}
    output_format: |
      1. 当前代码存在的问题分析。
      2. 重构思路和采取的策略。
      3. 重构后的代码 (包含注释说明关键改动)。
    constraints: |
      - 重构必须保证外部行为(功能)不发生改变。
      - 充分利用 {{ language }} 的语言特性和标准库。
  user: |
    请重构以下 {{ language }} 代码，主要目标是提升 {{ refactor_goal }}：
    
    ```{{ language }}
    {{ code_content }}
    ```
